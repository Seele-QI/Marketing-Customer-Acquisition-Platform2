appId: com.cuocuoai
productName: 招财猫
copyright: Copyright © 2026 招财猫

directories:
  output: release
  buildResources: build

files:
  - "electron/dist-electron/**/*.js"
  - "package.json"
  - "!**/*.map"
  - "!**/__tests__/**"
  - "!**/*.test.ts"

asar: true
asarUnpack:
  - "node_modules/node-machine-id/**"
  - "node_modules/electron-log/**"

extraResources:
  - from: "resources"
    to: "."
    filter:
      - "python/**"
      - "ffmpeg/**"
      - "runtime/**"
      - "next-standalone/**"
      - "bgm/**"
      - "main.py"
      - "routes/**"
      - "scripts/**"
      - ".env"

extraMetadata:
  main: electron/dist-electron/main.js
  version: 0.1.3

afterPack: scripts/after-pack.cjs

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: build/icon.ico
  artifactName: ${productName}-Setup-${version}.${ext}
  # 跳过 rcedit/winCodeSign 下载（内网/无法访问 GitHub 时 dist:win 会超时失败）
  signAndEditExecutable: false

# Mac 通用包（arm64+x64）；不签名、不公证 — 见 docs/deploy/ELECTRON-BUILD-MAC.md
mac:
  target:
    - target: dmg
      arch:
        - universal
  icon: build/icon.icns
  category: public.app-category.business
  artifactName: ${productName}-${version}-mac.${ext}
  identity: null
  hardenedRuntime: false
  gatekeeperAssess: false

dmg:
  artifactName: ${productName}-${version}-mac.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 招财猫
  uninstallDisplayName: 招财猫 ${version}
  # 默认安装目录使用纯 ASCII，避免中文路径导致 node-machine-id 等原生模块加载失败
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  include: "build/installer.nsh"
  installerLanguages:
    - zh_CN
  deleteAppDataOnUninstall: false

# 国内 OSS/CDN generic 源（构建时生成 latest.yml；运行时可用 UPDATE_FEED_URL 覆盖）
# 发版上传：pnpm release:upload-oss —— 见 docs/deploy/DESKTOP-UPDATE-OSS.md
publish:
  provider: generic
  url: https://mcap-desktop-releases.oss-cn-beijing.aliyuncs.com/releases/
