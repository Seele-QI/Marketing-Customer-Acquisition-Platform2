name: Desktop Mac Universal

on:
  workflow_dispatch:
    inputs:
      upload_oss:
        description: Upload DMG + latest-mac.yml to Aliyun OSS
        type: boolean
        default: false
  push:
    tags:
      - 'desktop-mac-v*'

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build-mac:
    runs-on: macos-14
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install Rosetta (x86_64 Python / universal resources)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node deps
        run: pnpm install --frozen-lockfile

      - name: Write project .env for packaged bundle
        env:
          DESKTOP_PACKAGED_ENV: ${{ secrets.DESKTOP_PACKAGED_ENV }}
          CLOUD_API_URL: ${{ secrets.CLOUD_API_URL }}
          UPDATE_FEED_URL: ${{ secrets.UPDATE_FEED_URL }}
        run: |
          if [ -z "$DESKTOP_PACKAGED_ENV" ]; then
            echo "Secret DESKTOP_PACKAGED_ENV is required (full project .env content for packaging)."
            echo "See docs/deploy/ELECTRON-BUILD-MAC.md"
            exit 1
          fi
          printf '%s\n' "$DESKTOP_PACKAGED_ENV" > .env
          if [ -n "$CLOUD_API_URL" ]; then
            grep -q '^CLOUD_API_URL=' .env || echo "CLOUD_API_URL=$CLOUD_API_URL" >> .env
          fi
          if [ -n "$UPDATE_FEED_URL" ]; then
            grep -q '^UPDATE_FEED_URL=' .env || echo "UPDATE_FEED_URL=$UPDATE_FEED_URL" >> .env
          fi

      - name: Generate icons (incl. icon.icns)
        run: pnpm icons:build

      - name: Build resources (Python dual-arch + Next + ffmpeg)
        run: pnpm resources:build

      - name: Preflight
        run: pnpm preflight

      - name: Build universal DMG
        run: pnpm dist:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-universal-dmg
          path: |
            release/*-mac.dmg
            release/latest-mac.yml
            release/*.blockmap
          if-no-files-found: error

      - name: Upload to OSS
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_oss }}
        env:
          OSS_REGION: ${{ secrets.OSS_REGION }}
          OSS_BUCKET: ${{ secrets.OSS_BUCKET }}
          OSS_ACCESS_KEY_ID: ${{ secrets.OSS_ACCESS_KEY_ID }}
          OSS_ACCESS_KEY_SECRET: ${{ secrets.OSS_ACCESS_KEY_SECRET }}
          OSS_PREFIX: ${{ secrets.OSS_PREFIX }}
        run: |
          export OSS_PREFIX="${OSS_PREFIX:-releases}"
          pnpm release:upload-oss
