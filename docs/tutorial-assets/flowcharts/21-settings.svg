<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F9FF"/><stop offset="1" stop-color="#E8F1FF"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1D4ED8" flood-opacity=".12"/></filter><marker id="arrow-21settingssvg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#6B8AC7"/></marker></defs><rect width="1200" height="1400" fill="url(#bg)"/><circle cx="1100" cy="100" r="170" fill="#2563EB" opacity=".05"/><circle cx="80" cy="1320" r="220" fill="#0EA5E9" opacity=".06"/><text x="100" y="92" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="24" font-weight="700" fill="#2563EB" letter-spacing="3">AI 中台 · 使用流程</text><text x="100" y="160" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="50" font-weight="800" fill="#102A56">系统设置</text><text x="100" y="205" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#587099">调整账户选项并确认配置生效</text><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif" filter="url(#shadow)"><rect x="365" y="285" width="470" height="100" rx="50" fill="#1D4ED8"/><text x="600" y="346" text-anchor="middle" font-size="28" font-weight="700" fill="white">进入系统设置</text><path d="M600 393V447" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-21settingssvg)"/>
