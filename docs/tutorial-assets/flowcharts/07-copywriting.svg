<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1752" viewBox="0 0 1200 1752"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F9FF"/><stop offset="1" stop-color="#E8F1FF"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1D4ED8" flood-opacity=".12"/></filter><marker id="arrow-07copywritingsvg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#6B8AC7"/></marker></defs><rect width="1200" height="1752" fill="url(#bg)"/><circle cx="1100" cy="100" r="170" fill="#2563EB" opacity=".05"/><circle cx="80" cy="1672" r="220" fill="#0EA5E9" opacity=".06"/><text x="100" y="92" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="24" font-weight="700" fill="#2563EB" letter-spacing="3">AI 中台 · 使用流程</text><text x="100" y="160" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="50" font-weight="800" fill="#102A56">AI 文案创作</text><text x="100" y="205" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#587099">先策划选题，再围绕选题创作脚本</text><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif" filter="url(#shadow)"><rect x="365" y="285" width="470" height="100" rx="50" fill="#1D4ED8"/><text x="600" y="346" text-anchor="middle" font-size="28" font-weight="700" fill="white">告诉 AI 你的行业身份</text><path d="M600 393V447" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-07copywritingsvg)"/>
<rect x="270" y="461" width="660" height="120" rx="28" fill="#FFF7E8" stroke="#F4C96B" stroke-width="2"/><circle cx="330" cy="521" r="30" fill="#FFE9B8"/><text x="330" y="531" text-anchor="middle" font-size="24" font-weight="700" fill="#B66A00">1</text><text x="390" y="513" font-size="26" font-weight="700" fill="#6B4400">让 AI 批量策划选题</text><text x="390" y="548" font-size="18" fill="#9A6A20">示例：请帮我创作 10 个爆款选题</text><path d="M600 589V623" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-07copywritingsvg)"/>
<rect x="270" y="637" width="660" height="120" rx="28" fill="white" stroke="#C9D8F2" stroke-width="2"/><circle cx="330" cy="697" r="30" fill="#E8F1FF"/><text x="330" y="707" text-anchor="middle" font-size="24" font-weight="700" fill="#2563EB">2</text><text x="390" y="689" font-size="26" font-weight="700" fill="#17305C">查看并选择喜欢的选题</text><text x="390" y="724" font-size="18" fill="#6980A5">优先选择符合客户需求和业务优势的方向</text><path d="M600 765V799" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-07copywritingsvg)"/>
<rect x="270" y="813" width="660" height="120" rx="28" fill="white" stroke="#C9D8F2" stroke-width="2"/><circle cx="330" cy="873" r="30" fill="#E8F1FF"/><text x="330" y="883" text-anchor="middle" font-size="24" font-weight="700" fill="#2563EB">3</text><text x="390" y="865" font-size="26" font-weight="700" fill="#17305C">让 AI 围绕选题创作脚本</text><text x="390" y="900" font-size="18" fill="#6980A5">说明发布平台、目标用户和期望风格</text><path d="M600 941V975" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-07copywritingsvg)"/>
<rect x="270" y="989" width="660" height="120" rx="28" fill="#FFF7E8" stroke="#F4C96B" stroke-width="2"/><circle cx="330" cy="1049" r="30" fill="#FFE9B8"/><text x="330" y="1059" text-anchor="middle" font-size="24" font-weight="700" fill="#B66A00">4</text><text x="390" y="1041" font-size="26" font-weight="700" fill="#6B4400">AI 生成完整脚本</text><text x="390" y="1076" font-size="18" fill="#9A6A20">获得标题、开头、正文和结尾引导</text><path d="M600 1117V1151" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-07copywritingsvg)"/>
<polygon points="600,1160 830,1231 600,1302 370,1231" fill="white" stroke="#78A0E4" stroke-width="3"/><text x="600" y="1222" text-anchor="middle" font-size="25" font-weight="700" fill="#17305C">脚本是否满意？</text><text x="600" y="1254" text-anchor="middle" font-size="17" fill="#6980A5">检查吸引力、内容逻辑和业务准确性</text><path d="M600 1310V1327" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-07copywritingsvg)"/>
<rect x="270" y="1341" width="660" height="120" rx="28" fill="white" stroke="#C9D8F2" stroke-width="2"/><circle cx="330" cy="1401" r="30" fill="#E8F1FF"/><text x="330" y="1411" text-anchor="middle" font-size="24" font-weight="700" fill="#2563EB">6</text><text x="390" y="1393" font-size="26" font-weight="700" fill="#17305C">提出具体修改要求</text><text x="390" y="1428" font-size="18" fill="#6980A5">说明要修改的开头、长度、语气或卖点</text><path d="M600 1469V1503" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-07copywritingsvg)"/>
<rect x="365" y="1517" width="470" height="100" rx="50" fill="#169B68"/><text x="600" y="1578" text-anchor="middle" font-size="28" font-weight="700" fill="white">确认并使用最终脚本</text><rect x="835" y="1336" width="305" height="78" rx="18" fill="#FFF0F0" stroke="#E77878" stroke-width="2"/><text x="987" y="1368" text-anchor="middle" font-size="17" font-weight="700" fill="#C43F3F">异常处理</text><text x="987" y="1394" text-anchor="middle" font-size="16" fill="#B75252">不满意：明确问题后让 AI 继续修改</text></g><text x="100" y="1704" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="16" fill="#7890B3">蓝色 = 用户操作　橙色 = AI 处理　绿色 = 最终结果　红色 = 异常处理</text></svg>