<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5F9FF"/><stop offset="1" stop-color="#E8F1FF"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1D4ED8" flood-opacity=".12"/></filter><marker id="arrow-01loginsvg" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 Z" fill="#6B8AC7"/></marker></defs><rect width="1200" height="1400" fill="url(#bg)"/><circle cx="1100" cy="100" r="170" fill="#2563EB" opacity=".05"/><circle cx="80" cy="1320" r="220" fill="#0EA5E9" opacity=".06"/><text x="100" y="92" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="24" font-weight="700" fill="#2563EB" letter-spacing="3">AI 中台 · 使用流程</text><text x="100" y="160" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="50" font-weight="800" fill="#102A56">注册与登录</text><text x="100" y="205" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#587099">从邮箱验证到进入 AI 中台</text><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif" filter="url(#shadow)"><rect x="365" y="285" width="470" height="100" rx="50" fill="#1D4ED8"/><text x="600" y="346" text-anchor="middle" font-size="28" font-weight="700" fill="white">开始登录</text><path d="M600 393V447" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-01loginsvg)"/>
<rect x="270" y="461" width="660" height="120" rx="28" fill="white" stroke="#C9D8F2" stroke-width="2"/><circle cx="330" cy="521" r="30" fill="#E8F1FF"/><text x="330" y="531" text-anchor="middle" font-size="24" font-weight="700" fill="#2563EB">1</text><text x="390" y="513" font-size="26" font-weight="700" fill="#17305C">输入常用邮箱</text><text x="390" y="548" font-size="18" fill="#6980A5">确认邮箱地址填写正确</text><path d="M600 589V623" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-01loginsvg)"/>
<rect x="270" y="637" width="660" height="120" rx="28" fill="white" stroke="#C9D8F2" stroke-width="2"/><circle cx="330" cy="697" r="30" fill="#E8F1FF"/><text x="330" y="707" text-anchor="middle" font-size="24" font-weight="700" fill="#2563EB">2</text><text x="390" y="689" font-size="26" font-weight="700" fill="#17305C">查收登录邮件</text><text x="390" y="724" font-size="18" fill="#6980A5">检查收件箱、垃圾邮件和广告分类</text><path d="M600 765V799" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-01loginsvg)"/>
<polygon points="600,808 830,879 600,950 370,879" fill="white" stroke="#78A0E4" stroke-width="3"/><text x="600" y="870" text-anchor="middle" font-size="25" font-weight="700" fill="#17305C">是否收到邮件？</text><text x="600" y="902" text-anchor="middle" font-size="17" fill="#6980A5">未收到时检查邮箱并重新发送</text><path d="M600 958V975" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-01loginsvg)"/>
<rect x="270" y="989" width="660" height="120" rx="28" fill="white" stroke="#C9D8F2" stroke-width="2"/><circle cx="330" cy="1049" r="30" fill="#E8F1FF"/><text x="330" y="1059" text-anchor="middle" font-size="24" font-weight="700" fill="#2563EB">4</text><text x="390" y="1041" font-size="26" font-weight="700" fill="#17305C">点击登录链接</text><text x="390" y="1076" font-size="18" fill="#6980A5">在链接有效期内完成验证</text><path d="M600 1117V1151" stroke="#6B8AC7" stroke-width="5" marker-end="url(#arrow-01loginsvg)"/>
<rect x="365" y="1165" width="470" height="100" rx="50" fill="#169B68"/><text x="600" y="1226" text-anchor="middle" font-size="28" font-weight="700" fill="white">进入工作台</text><rect x="835" y="984" width="305" height="78" rx="18" fill="#FFF0F0" stroke="#E77878" stroke-width="2"/><text x="987" y="1016" text-anchor="middle" font-size="17" font-weight="700" fill="#C43F3F">异常处理</text><text x="987" y="1042" text-anchor="middle" font-size="16" fill="#B75252">未收到：检查邮箱后重新发送</text></g><text x="100" y="1352" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="16" fill="#7890B3">蓝色 = 用户操作　橙色 = AI 处理　绿色 = 最终结果　红色 = 异常处理</text></svg>