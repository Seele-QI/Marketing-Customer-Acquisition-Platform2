<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6F9FF"/><stop offset="1" stop-color="#E8F1FF"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#153B74" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#7192C9"/></marker></defs><rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1810" cy="70" r="240" fill="#2563EB" opacity=".05"/><text x="80" y="90" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="23" font-weight="700" fill="#2563EB" letter-spacing="4">招财猫 AI 中台 · 完整工作流</text><text x="80" y="165" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="52" font-weight="800" fill="#102A56">图文视频创作</text><text x="80" y="210" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#607899">把口播文案、图片和参考音色组合成完整短视频</text><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif" filter="url(#shadow)"><rect x="80" y="315" width="250" height="390" rx="28" fill="#FFFFFF" stroke="#D3DFF2" stroke-width="2"/><text x="112" y="380" font-size="55" font-weight="800" fill="#2563EB">01</text><text x="112" y="438" font-size="25" font-weight="700" fill="#17305C">准备口播内容</text><text x="112" y="510" font-size="17" fill="#657C9E">AI 生成选题</text><text x="112" y="550" font-size="17" fill="#657C9E">或提取参考文案</text><text x="112" y="590" font-size="17" fill="#657C9E">改写并确认文案</text><path d="M337 500H362" stroke="#7192C9" stroke-width="5" marker-end="url(#arrow)"/><rect x="372" y="315" width="250" height="390" rx="28" fill="#FFFFFF" stroke="#D3DFF2" stroke-width="2"/><text x="404" y="380" font-size="55" font-weight="800" fill="#2563EB">02</text><text x="404" y="438" font-size="25" font-weight="700" fill="#17305C">整理图片素材</text><text x="404" y="510" font-size="17" fill="#657C9E">按文案段落配图</text><text x="404" y="550" font-size="17" fill="#657C9E">统一比例与风格</text><text x="404" y="590" font-size="17" fill="#657C9E">调整正确顺序</text><path d="M629 500H654" stroke="#7192C9" stroke-width="5" marker-end="url(#arrow)"/><rect x="664" y="315" width="250" height="390" rx="28" fill="#FFFFFF" stroke="#D3DFF2" stroke-width="2"/><text x="696" y="380" font-size="55" font-weight="800" fill="#2563EB">03</text><text x="696" y="438" font-size="25" font-weight="700" fill="#17305C">上传三类素材</text><text x="696" y="510" font-size="17" fill="#657C9E">图片素材</text><text x="696" y="550" font-size="17" fill="#657C9E">清晰参考音色</text><text x="696" y="590" font-size="17" fill="#657C9E">最终口播文案</text><path d="M921 500H946" stroke="#7192C9" stroke-width="5" marker-end="url(#arrow)"/><rect x="956" y="315" width="250" height="390" rx="28" fill="#FFF8E8" stroke="#F0C96B" stroke-width="2"/><text x="988" y="380" font-size="55" font-weight="800" fill="#D99B21">04</text><text x="988" y="438" font-size="25" font-weight="700" fill="#6B4400">AI 生成配音</text><text x="988" y="510" font-size="17" fill="#8C682A">克隆参考音色</text><text x="988" y="550" font-size="17" fill="#8C682A">按文案自动断句</text><text x="988" y="590" font-size="17" fill="#8C682A">匹配图片时序</text><path d="M1213 500H1238" stroke="#7192C9" stroke-width="5" marker-end="url(#arrow)"/><rect x="1248" y="315" width="250" height="390" rx="28" fill="#FFF8E8" stroke="#F0C96B" stroke-width="2"/><text x="1280" y="380" font-size="55" font-weight="800" fill="#D99B21">05</text><text x="1280" y="438" font-size="25" font-weight="700" fill="#6B4400">自动合成视频</text><text x="1280" y="510" font-size="17" fill="#8C682A">生成字幕</text><text x="1280" y="550" font-size="17" fill="#8C682A">添加 BGM 与转场</text><text x="1280" y="590" font-size="17" fill="#8C682A">完成图文成片</text><path d="M1505 500H1530" stroke="#7192C9" stroke-width="5" marker-end="url(#arrow)"/><rect x="1540" y="315" width="250" height="390" rx="28" fill="#178759" stroke="#178759" stroke-width="2"/><text x="1572" y="380" font-size="55" font-weight="800" fill="#AEE6CA">06</text><text x="1572" y="438" font-size="25" font-weight="700" fill="#FFFFFF">检查下载发布</text><text x="1572" y="510" font-size="17" fill="#D8F2E5">检查顺序和断句</text><text x="1572" y="550" font-size="17" fill="#D8F2E5">下载最终视频</text><text x="1572" y="590" font-size="17" fill="#D8F2E5">按需一键分发</text></g><rect x="80" y="800" width="1740" height="135" rx="24" fill="#DDE9FA"/><text x="120" y="853" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="22" font-weight="700" fill="#244A7D">关键原则</text><text x="120" y="898" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="20" fill="#506D94">每张图片都应服务于对应文案段落；统一画面比例和视觉风格，成片会更连贯。</text></svg>