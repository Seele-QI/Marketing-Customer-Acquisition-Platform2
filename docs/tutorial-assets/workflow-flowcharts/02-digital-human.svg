  <rect x="80" y="565" width="390" height="220" rx="28" fill="#FFF0DE"/><text x="120" y="620" font-size="21" font-weight="700" fill="#C56B22">入口二 · 参考内容</text><text x="120" y="670" font-size="25" font-weight="800" fill="#173D48">提取视频文案</text><text x="120" y="720" font-size="18" fill="#617D8B">校对品牌名与数字</text><text x="120" y="758" font-size="18" fill="#617D8B">使用 AI 完成二次改写</text>
