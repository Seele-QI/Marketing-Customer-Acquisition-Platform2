<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#183B49" flood-opacity=".12"/></filter><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#4D7C89"/></marker></defs><rect width="1920" height="1080" fill="#F3F8F7"/><text x="80" y="90" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="23" font-weight="700" fill="#167A70" letter-spacing="4">招财猫 AI 中台 · 双入口工作流</text><text x="80" y="165" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="52" font-weight="800" fill="#173D48">数字人口播视频创作</text><text x="80" y="210" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="21" fill="#607D84">原创选题或参考视频，都可以汇入同一条数字人生产线</text><g font-family="Microsoft YaHei,Noto Sans SC,sans-serif" filter="url(#shadow)">
