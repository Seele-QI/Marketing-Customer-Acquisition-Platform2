  <rect x="695" y="405" width="305" height="280" rx="28" fill="white"/><text x="847" y="465" text-anchor="middle" font-size="25" font-weight="800" fill="#173D48">准备三项素材</text><text x="742" y="520" font-size="18" fill="#617D8B">数字人形象图</text><text x="742" y="558" font-size="18" fill="#617D8B">2～15 秒参考音色</text><text x="742" y="596" font-size="18" fill="#617D8B">最终口播文案</text>
