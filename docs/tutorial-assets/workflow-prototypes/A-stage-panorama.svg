<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F6F9FF"/><stop offset="1" stop-color="#E8F1FF"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#153B74" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#7192C9"/></marker></defs>
<rect width="1920" height="1080" fill="url(#bg)"/><circle cx="1810" cy="80" r="250" fill="#2563EB" opacity=".05"/>
<text x="90" y="100" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="24" font-weight="700" fill="#2563EB" letter-spacing="4">预案 A · 阶段式全景路线图</text><text x="90" y="175" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="54" font-weight="800" fill="#102A56">数字人口播视频创作方法</text><text x="90" y="220" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="22" fill="#607899">从内容策划到视频下载与发布，一张图看懂完整工作流</text>
<g font-family="Microsoft YaHei,Noto Sans SC,sans-serif" filter="url(#s)">
<rect x="90" y="330" width="245" height="350" rx="28" fill="white"/><text x="125" y="390" font-size="56" font-weight="800" fill="#2563EB">01</text><text x="125" y="445" font-size="26" font-weight="700" fill="#17305C">准备内容</text><text x="125" y="500" font-size="18" fill="#657C9E">AI 批量生成选题</text><text x="125" y="535" font-size="18" fill="#657C9E">或提取参考视频文案</text><text x="125" y="570" font-size="18" fill="#657C9E">选择选题并创作文案</text>
<path d="M345 505H390" stroke="#7192C9" stroke-width="5" marker-end="url(#a)"/>
<rect x="405" y="330" width="245" height="350" rx="28" fill="white"/><text x="440" y="390" font-size="56" font-weight="800" fill="#2563EB">02</text><text x="440" y="445" font-size="26" font-weight="700" fill="#17305C">准备素材</text><text x="440" y="500" font-size="18" fill="#657C9E">数字人形象图</text><text x="440" y="535" font-size="18" fill="#657C9E">2～15 秒参考音色</text><text x="440" y="570" font-size="18" fill="#657C9E">最终口播文案</text>
<path d="M660 505H705" stroke="#7192C9" stroke-width="5" marker-end="url(#a)"/>
<rect x="720" y="330" width="245" height="350" rx="28" fill="#FFF8E8" stroke="#F0C96B" stroke-width="2"/><text x="755" y="390" font-size="56" font-weight="800" fill="#D99B21">03</text><text x="755" y="445" font-size="26" font-weight="700" fill="#6B4400">生成分镜</text><text x="755" y="500" font-size="18" fill="#8C682A">上传图片与音色</text><text x="755" y="535" font-size="18" fill="#8C682A">粘贴口播文案</text><text x="755" y="570" font-size="18" fill="#8C682A">AI 自动拆段写分镜</text>
<path d="M975 505H1020" stroke="#7192C9" stroke-width="5" marker-end="url(#a)"/>
<rect x="1035" y="330" width="245" height="350" rx="28" fill="white"/><text x="1070" y="390" font-size="56" font-weight="800" fill="#2563EB">04</text><text x="1070" y="445" font-size="26" font-weight="700" fill="#17305C">人工优化</text><text x="1070" y="500" font-size="18" fill="#657C9E">检查人物与场景</text><text x="1070" y="535" font-size="18" fill="#657C9E">修改动作与镜头</text><text x="1070" y="570" font-size="18" fill="#657C9E">确认每段提示词</text>
<path d="M1290 505H1335" stroke="#7192C9" stroke-width="5" marker-end="url(#a)"/>
<rect x="1350" y="330" width="215" height="350" rx="28" fill="#FFF8E8" stroke="#F0C96B" stroke-width="2"/><text x="1385" y="390" font-size="56" font-weight="800" fill="#D99B21">05</text><text x="1385" y="445" font-size="26" font-weight="700" fill="#6B4400">生成成片</text><text x="1385" y="500" font-size="18" fill="#8C682A">等待片段完成</text><text x="1385" y="535" font-size="18" fill="#8C682A">失败片段单独重试</text><text x="1385" y="570" font-size="18" fill="#8C682A">系统自动合成</text>
<path d="M1575 505H1620" stroke="#7192C9" stroke-width="5" marker-end="url(#a)"/>
<rect x="1635" y="330" width="195" height="350" rx="28" fill="#178759"/><text x="1670" y="390" font-size="56" font-weight="800" fill="#AEE6CA">06</text><text x="1670" y="445" font-size="26" font-weight="700" fill="white">下载发布</text><text x="1670" y="500" font-size="18" fill="#D8F2E5">预览完整视频</text><text x="1670" y="535" font-size="18" fill="#D8F2E5">下载视频与封面</text><text x="1670" y="570" font-size="18" fill="#D8F2E5">按需一键分发</text>
</g><rect x="90" y="790" width="1740" height="130" rx="24" fill="#DDE9FA"/><text x="130" y="842" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="22" font-weight="700" fill="#244A7D">关键原则</text><text x="130" y="882" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="20" fill="#506D94">先把选题和口播文案做对，再生成视频；分镜提示词必须人工检查，成片发布前必须再次确认。</text></svg>