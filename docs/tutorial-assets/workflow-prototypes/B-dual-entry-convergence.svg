<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#183B49" flood-opacity=".12"/></filter><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6 0 12Z" fill="#4D7C89"/></marker></defs><rect width="1920" height="1080" fill="#F3F8F7"/><text x="90" y="100" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="24" font-weight="700" fill="#167A70" letter-spacing="4">预案 B · 双入口汇流图</text><text x="90" y="175" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="54" font-weight="800" fill="#173D48">数字人口播视频创作方法</text><text x="90" y="220" font-family="Microsoft YaHei,Noto Sans SC,sans-serif" font-size="22" fill="#607D84">突出“原创选题”和“文案提取”两种起点，最终汇入同一视频生产线</text>
