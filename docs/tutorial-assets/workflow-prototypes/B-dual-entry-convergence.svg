<rect x="90" y="580" width="380" height="210" rx="28" fill="#FFF0DE"/><text x="130" y="635" font-size="22" font-weight="700" fill="#C56B22">入口二 · 参考内容</text><text x="130" y="685" font-size="25" font-weight="800" fill="#173D48">提取视频文案</text><text x="130" y="728" font-size="19" fill="#617D8B">人工校对 → AI 二次改写</text>
<path d="M470 425H610V555H685" fill="none" stroke="#4D7C89" stroke-width="5" marker-end="url(#a)"/><path d="M470 685H610V555H685" fill="none" stroke="#4D7C89" stroke-width="5" marker-end="url(#a)"/>
<rect x="700" y="430" width="300" height="250" rx="28" fill="white"/><text x="850" y="492" text-anchor="middle" font-size="24" font-weight="800" fill="#173D48">准备三项素材</text><text x="850" y="545" text-anchor="middle" font-size="19" fill="#617D8B">数字人形象图</text><text x="850" y="585" text-anchor="middle" font-size="19" fill="#617D8B">2～15 秒参考音色</text><text x="850" y="625" text-anchor="middle" font-size="19" fill="#617D8B">最终口播文案</text>
